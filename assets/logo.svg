<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="resq-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M256 32 L432 96 V240 C432 352 344 448 256 480 C168 448 80 352 80 240 V96 Z" 
        fill="url(#shield-grad)" 
        stroke="url(#resq-grad)" 
        stroke-width="12" 
        filter="url(#glow)" />

  <!-- Pulse Rings -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.3" stroke-dasharray="8 8" />
  <circle cx="256" cy="240" r="100" fill="none" stroke="#ef4444" stroke-width="4" opacity="0.5" />

  <!-- Emergency Cross / Signal Pulse Icon -->
  <path d="M226 150 H286 V210 H346 V270 H286 V330 H226 V270 H166 V210 H226 Z" 
        fill="url(#resq-grad)" 
        rx="8" />

  <!-- Signal Radar Waves -->
  <path d="M200 130 A140 140 0 0 1 312 130" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  <path d="M170 100 A180 180 0 0 1 342 100" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round" opacity="0.7" />

  <!-- Center Glow Dot -->
  <circle cx="256" cy="240" r="12" fill="#ffffff" filter="url(#glow)" />
</svg>
