<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ResQNet</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/accessibility.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg-main);">

  <div style="background:var(--bg-surface); padding:3rem; border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); border:1px solid var(--border-color); max-width:400px; width:100%;">
    <div style="text-align:center; margin-bottom:2rem;">
      <i data-lucide="radio-tower" style="width:48px; height:48px; color:var(--primary); margin-bottom:1rem;"></i>
      <h2>ResQNet Access</h2>
    </div>
    
    <div style="display:flex; flex-direction:column; gap:1rem;">
      <a href="citizen.html" class="btn btn-outline" style="justify-content:flex-start; padding:1rem;"><i data-lucide="user"></i> Login as Citizen</a>
      <a href="command-center.html" class="btn btn-primary" style="justify-content:flex-start; padding:1rem;"><i data-lucide="shield"></i> Login as Command Center</a>
      <a href="rescue-team.html" class="btn btn-outline" style="justify-content:flex-start; padding:1rem;"><i data-lucide="truck"></i> Login as Rescue Unit</a>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
